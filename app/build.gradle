plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixel.systemappmanager'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pixel.systemappmanager'
        minSdk 33
        targetSdk 35
        versionCode 12
        versionName '1.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
